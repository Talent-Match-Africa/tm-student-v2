name: Student Portal CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: student-portal-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Student portal quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out student portal source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm
        run: npm install --global npm@10.8.2

      - name: Verify toolchain
        run: |
          test "$(node --version)" = "v$(cat .nvmrc)"
          test "$(npm --version)" = "10.8.2"

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Run student portal quality gate
        run: npm run ci:check

  deploy:
    name: Deploy student portal to staging
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: staging
      url: https://student.talentmatch.rw
    env:
      DEPLOY_HOST: ${{ vars.STAGING_DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.STAGING_DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.STAGING_DEPLOY_USER }}

    steps:
      - name: Configure restricted deployment identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          test -n "${DEPLOY_HOST}"
          test -n "${DEPLOY_PORT}"
          test -n "${DEPLOY_USER}"
          test -n "${SSH_PRIVATE_KEY}"
          test -n "${SSH_KNOWN_HOSTS}"
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${SSH_PRIVATE_KEY}" > "${HOME}/.ssh/deploy_key"
          printf '%s\n' "${SSH_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/deploy_key" "${HOME}/.ssh/known_hosts"
          ssh-keygen -y -f "${HOME}/.ssh/deploy_key" >/dev/null
          if test "${DEPLOY_PORT}" = "22"; then
            known_host="${DEPLOY_HOST}"
          else
            known_host="[${DEPLOY_HOST}]:${DEPLOY_PORT}"
          fi
          ssh-keygen -F "${known_host}" -f "${HOME}/.ssh/known_hosts" \
            >/dev/null

      - name: Deploy immutable student portal commit
        run: |
          ssh \
            -i "${HOME}/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -p "${DEPLOY_PORT}" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "deploy ${GITHUB_SHA} ${GITHUB_RUN_ID}"
