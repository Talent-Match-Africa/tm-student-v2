name: Student Portal CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: student-portal-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Student portal quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out student portal source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm
        run: npm install --global npm@10.8.2

      - name: Verify toolchain
        run: |
          test "$(node --version)" = "v$(cat .nvmrc)"
          test "$(npm --version)" = "10.8.2"

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Run student portal quality gate
        run: npm run ci:check
